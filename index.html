
<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java 1</title>
</head>
<body>
    <label>Numri i parë</label>
    <input type="number" id="nr1">
    <br>

    <label>Numri i dytë</label>
    <input type="number" id="nr2">
    <br>

    <button type="button" onclick="sum()">Mbledhja (+)</button>
    <button type="button" onclick="zbritje()">Zbritja (-)</button>
    <button type="button" onclick="shumezimi()">shumezimi (*)</button>
    <button type="button" onclick="pjestimi()">pjestimi (/)</button>

    <p id="result"></p>

    <script>
        function sum() {
            var a = Number(document.getElementById('nr1').value);
            var b = Number(document.getElementById('nr2').value);

            var c = a + b;

            document.getElementById('result').innerHTML = c;
        }

        function zbritje() {
            var a = Number(document.getElementById('nr1').value);
            var b = Number(document.getElementById('nr2').value);

            var e = a - b;

            document.getElementById('result').innerHTML = e;
        }
         function shumezimi() {
            var a = Number(document.getElementById('nr1').value);
            var b = Number(document.getElementById('nr2').value);

            var s = a * b;

            document.getElementById('result').innerHTML = s;
         }
         function pjestimi() {
            var a = Number(document.getElementById('nr1').value);
            var b = Number(document.getElementById('nr2').value);

             if (b == 0) 
             {
        document.getElementById('result').innerHTML = "Nuk mund të pjesëtohet me zero!";
             } 
             else 
             {
                  var c = a / b;
                document.getElementById('result').innerHTML = c;
              }
         }
    </script>
</body>
</html>
